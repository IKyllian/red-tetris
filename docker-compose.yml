services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - red_tetris_network
    environment:
      IP: ${IP}
      VITE_IP_URL: ${VITE_IP_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: red_tetris_db
      FRONT_DIST_PATH: ${FRONT_DIST_PATH}
    ports:
      - "3000:3000"
    depends_on:
      - red_tetris_db

  # Database
  red_tetris_db:
    image: postgres
    networks:
      - red_tetris_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

networks:
  red_tetris_network:
    name: red_tetris_network
    driver: bridge

volumes:
  frontend_dist: